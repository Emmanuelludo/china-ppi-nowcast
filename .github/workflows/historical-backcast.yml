name: Historical PPI model backcast

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-backcast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backcast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Generate contaminated historical backcast
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import joblib
          import numpy as np
          import pandas as pd

          root = Path('.')
          training_path = root / 'data/processed/training/reconstructed-v2/final.csv'
          bundle_dir = root / 'models/reconstructed-v2/final'
          manifest = json.loads((bundle_dir / 'manifest.json').read_text(encoding='utf-8'))
          frame = pd.read_csv(training_path)

          core_keys = [
              'category_factor_regression',
              'gradient_boosting',
              'economic_ml_hybrid',
              'product_level_ridge',
              'sector_first_aggregation',
              'random_forest',
          ]
          labels = {entry['key']: entry['label'] for entry in manifest['models']}
          entries = {entry['key']: entry for entry in manifest['models']}

          out = frame[['target_month', 'target_mom_pct']].copy()
          out = out.rename(columns={'target_mom_pct': 'actual_ppi_mom_pct'})
          prediction_cols = []
          for key in core_keys:
              entry = entries[key]
              model = joblib.load(bundle_dir / entry['file'])
              cols = entry['feature_columns']
              X = frame.reindex(columns=cols).astype(float)
              colname = f'pred__{key}'
              out[colname] = np.asarray(model.predict(X), dtype=float)
              prediction_cols.append(colname)

          out['model_median'] = out[prediction_cols].median(axis=1)
          out = out[out['target_month'].between('2025-01', '2026-08')].reset_index(drop=True)
          for col in prediction_cols + ['model_median']:
              out[f'error__{col.removeprefix("pred__")}'] = out[col] - out['actual_ppi_mom_pct']

          out_path = root / 'reports/historical_backcast_2025_2026.csv'
          out.to_csv(out_path, index=False)

          text_table = out.to_csv(index=False, float_format='%.3f')
          md = [
              '# Historical PPI model backcast: Jan 2025–Aug 2026',
              '',
              'This is intentionally **contaminated/in-sample**. It applies the current reconstructed-v2 final-vintage fitted objects (trained through Aug 2026) to their own historical feature rows. It is not an ex-ante forecast evaluation.',
              '',
              '```csv',
              text_table.rstrip(),
              '```',
              '',
              'Model labels:',
          ]
          md.extend([f'- `{k}`: {labels[k]}' for k in core_keys])
          (root / 'reports/historical_backcast_2025_2026.md').write_text('\n'.join(md) + '\n', encoding='utf-8')
          print(out.to_string(index=False))
          PY
      - name: Commit report
        run: |
          if [[ -z "$(git status --porcelain -- reports/historical_backcast_2025_2026.csv reports/historical_backcast_2025_2026.md)" ]]; then
            echo "No report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add reports/historical_backcast_2025_2026.csv reports/historical_backcast_2025_2026.md
          git commit -m "analysis: add contaminated 2025-26 PPI model backcast"
          git push
