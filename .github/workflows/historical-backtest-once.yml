name: Historical PPI model backtest once

on:
  push:
    branches: [tmp-historical-backtest]
    paths:
      - ".github/workflows/historical-backtest-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-historical-backtest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e .

      - name: Score historical rows with reconstructed-v2 early and final models
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import joblib
          import numpy as np
          import pandas as pd

          root = Path('.')
          core = {
              'category_factor_regression',
              'gradient_boosting',
              'economic_ml_hybrid',
              'product_level_ridge',
              'sector_first_aggregation',
              'random_forest',
          }
          Path('reports').mkdir(exist_ok=True)

          def score(vintage: str):
              training = pd.read_csv(root / f'data/processed/training/reconstructed-v2/{vintage}.csv')
              training = training.loc[(training['target_month'] >= '2025-01') & (training['target_month'] <= '2026-08')].copy()
              bundle = root / f'models/reconstructed-v2/{vintage}'
              manifest = json.loads((bundle / 'manifest.json').read_text(encoding='utf-8'))
              out = training[['target_month','target_mom_pct']].rename(columns={'target_mom_pct':'actual_ppi_mom_pct'}).copy()
              pred_cols = []
              for entry in manifest['models']:
                  key = entry['key']
                  if key not in core:
                      continue
                  model = joblib.load(bundle / entry['file'])
                  cols = entry['feature_columns']
                  X = training.reindex(columns=cols).astype(float)
                  out[key] = np.asarray(model.predict(X), dtype=float)
                  pred_cols.append(key)
              out['model_median'] = out[pred_cols].median(axis=1)
              for col in pred_cols + ['model_median']:
                  out[col + '_error_pp'] = out[col] - out['actual_ppi_mom_pct']
              out = out.sort_values('target_month')
              out.to_csv(f'reports/historical_backtest_2025_2026_{vintage}.csv', index=False)
              summary = []
              for col in pred_cols + ['model_median']:
                  err = out[col] - out['actual_ppi_mom_pct']
                  summary.append({
                      'model': col,
                      'mae': float(err.abs().mean()),
                      'rmse': float(np.sqrt((err**2).mean())),
                      'bias': float(err.mean()),
                      'directional_accuracy': float((np.sign(out[col]) == np.sign(out['actual_ppi_mom_pct'])).mean()),
                  })
              pd.DataFrame(summary).to_csv(f'reports/historical_backtest_2025_2026_{vintage}_summary.csv', index=False)
              return out

          final = score('final')
          early = score('early')
          final.to_csv('reports/historical_backtest_2025_2026.csv', index=False)
          print('FINAL')
          print(final.to_string(index=False))
          print('\nEARLY')
          print(early.to_string(index=False))
          PY

      - name: Commit generated reports to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add reports/historical_backtest_2025_2026*.csv
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "analysis: historical reconstructed-v2 early and final PPI backtests"
            git push origin HEAD:tmp-historical-backtest
          fi
