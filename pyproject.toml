[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "china-ppi-nowcast"
version = "0.4.0"
description = "Vintage-aware China PPI nowcasting from NBS circulation prices"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "pydantic>=2.7",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "httpx>=0.27",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "typer>=0.12",
  "rich>=13",
  "matplotlib>=3.8",
  "seaborn>=0.13"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
china-ppi = "china_ppi_nowcast.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/china_ppi_nowcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
