[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "china-ppi-nowcast"
version = "0.5.0"
description = "Vintage-safe, survey-aligned China PPI nowcasting pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "joblib==1.5.3",
  "lxml==6.1.1",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.0"
]

[project.optional-dependencies]
product = ["xgboost-cpu==3.0.5", "catboost==1.2.8", "lightgbm==4.6.0", "shap==0.48.0"]

[project.scripts]
ppi-nowcast = "china_ppi_nowcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
