[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "china-ppi-nowcast"
version = "0.5.0"
description = "Vintage-safe, survey-aligned China PPI nowcasting pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "joblib>=1.3,<2",
  "lxml>=5,<7",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2"
]

[project.scripts]
ppi-nowcast = "china_ppi_nowcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
